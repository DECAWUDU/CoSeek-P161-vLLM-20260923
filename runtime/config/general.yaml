coseek1_focus_before_frame_verify: false
coseek1_focus_before_frame_verify_min_remaining_steps: 2
coseek1_focus_before_frame_verify_overlap: 0.5
coseek1_focus_before_frame_verify_min_window_s: 0.0
coseek1_long_frame_verify_to_skim_qwen: false
coseek1_candidate_search_manager: false
coseek1_candidate_search_max_focus_before_verify: 4
coseek1_candidate_search_overlap: 0.5
coseek1_candidate_search_max_candidates: 6
coseek1_candidate_search_split_stride_ratio: 0.5
coseek1_candidate_search_uncertain_text_route: true
coseek1_candidate_search_allow_short_frame_verify_direct: true
# When enabled, an unchanged skim revisit must pursue a new candidate window,
# a different overview scene, or reuse the existing observation instead of
# spending another local-Qwen call on identical frames.
coseek1_visited_window_information_gain: false
coseek1_visited_window_overlap: 0.85
coseek1_candidate_frontier: false
coseek1_candidate_frontier_max_items: 16
# V30 frontier-v2 representation switches. These only change planner-visible
# memory; they do not route tools or block answer actions.
coseek1_frontier_timestamp_cues: true
coseek1_frontier_timestamp_cue_radius_s: 6.0
coseek1_frontier_evidence_scope: true
coseek1_frontier_temporal_boundaries: false
coseek1_frontier_temporal_boundary_max_gap_s: 20.0
# V30 investigation-frontier experiment. This adds planner-visible bindings
# between open candidates and unresolved evidence; it never rewrites actions.
coseek1_frontier_investigation_state: false
coseek1_frontier_investigation_max_items: 12
coseek1_intent_preserving_router: true
coseek1_intent_preserving_same_range_overlap: 0.85
coseek1_preserve_planner_thought: true
# Adaptive V2: when a short planner verify is only one slice of an Overview
# candidate with overlapping boundary windows, preserve that local context in
# one Qwen localization + inline verification step. This is disabled by
# default so frozen runners remain reproducible.
coseek1_candidate_context_localize_enabled: false
# V33 ablates the V31 episode graph. Timestamped Observation Memory and the
# V14 Structured Evidence State remain the only persistent evidence layers.
coseek1_evidence_episode_frontier: false
coseek1_evidence_episode_max_items: 18
coseek1_episode_anchor_radius_s: 6.0
coseek1_episode_focus_window_s: 20.0
coseek1_episode_broad_window_s: 30.0
coseek1_episode_backend_router: false
