skim_qwen_window_summary_words: 12
skim_qwen_auto_focus_windows: true
skim_qwen_candidate_window_s: 18.0
skim_qwen_max_candidate_windows: 4

# V10.1 skeleton overview. Keep disabled by default until validated.
use_skeleton_overview: false
scene_aware_skim: true
skeleton_cache_dir: "./runs/_skeleton_cache"
skeleton_scene_min_s: 12.0
skeleton_scene_max_s: 90.0
skeleton_max_scenes: 24
skeleton_anchors_per_scene: 5
skeleton_caption_enabled: true
skeleton_caption_strategy: "contact_sheet"
skeleton_caption_frames: 48
skeleton_caption_frames_per_scene: 4
skeleton_caption_scenes_per_chunk: 7
skeleton_caption_retries: 2
skeleton_caption_retry_failed_cache: false
